<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <title>Cronus Debug Client</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1 class="title">Cronus Debug Client</h1>
            </div>
            <div class="header-right">
                <div class="connection-status">
                    <span class="status-indicator" id="statusIndicator"></span>
                    <span class="status-text" id="statusText">Connecting...</span>
                </div>
                <input 
                    type="text" 
                    id="serverUrl" 
                    placeholder="http://localhost:9000"
                    value="http://localhost:9000"
                    class="server-url-input"
                />
                <button id="connectBtn" class="btn btn-primary">Connect</button>
                <button id="disconnectBtn" class="btn btn-secondary" disabled>Disconnect</button>
            </div>
        </header>

        <!-- Main content -->
        <main class="main-content">
            <!-- Sidebar for controls -->
            <aside class="sidebar">
                <div class="panel">
                    <h2>Filters</h2>
                    <div class="filter-section">
                        <h3>Log Levels</h3>
                        <div class="level-filters">
                            <button class="level-btn active" data-level="debug">D</button>
                            <button class="level-btn active" data-level="info">I</button>
                            <button class="level-btn active" data-level="warning">W</button>
                            <button class="level-btn active" data-level="error">E</button>
                        </div>
                    </div>
                    <div class="filter-section">
                        <h3>Search</h3>
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="Filter logs..."
                            class="search-input"
                        />
                    </div>
                    <div class="filter-section">
                        <button id="clearLogsBtn" class="btn btn-secondary full-width">Clear Logs</button>
                    </div>
                </div>

                <div class="panel stats">
                    <h2>Statistics</h2>
                    <div class="stat-item">
                        <span class="stat-label">Total Logs:</span>
                        <span class="stat-value" id="totalLogs">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Filtered:</span>
                        <span class="stat-value" id="filteredLogs">0</span>
                    </div>
                </div>
            </aside>

            <!-- Log viewer -->
            <section class="log-viewer">
                <div class="log-header">
                    <h2>Logs</h2>
                    <label class="checkbox-label">
                        <input type="checkbox" id="autoScrollCheckbox" checked>
                        Auto-scroll
                    </label>
                </div>
                <div class="log-container" id="logContainer">
                    <div class="log-empty">
                        <p>Waiting for logs...</p>
                        <p class="log-empty-hint">Connect to Cronus server to see logs</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
